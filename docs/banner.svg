<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="SkeletonKit: shimmering skeleton loading placeholders for SwiftUI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b1733"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <!-- The shimmer band: dim, bright, dim. -->
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="760" y1="0" x2="1060" y2="110">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="930" cy="140" r="230" fill="url(#blob1)" filter="url(#blur)"/>
  <circle cx="1150" cy="450" r="200" fill="url(#blob2)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="235" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-2">SkeletonKit</text>
    <text x="82" y="290" fill="#cbd5e1" font-size="28" font-weight="500">Shimmering loading placeholders for SwiftUI</text>
    <g font-size="20" font-weight="600">
      <rect x="82" y="330" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="157" y="357" fill="#e2e8f0" text-anchor="middle">.skeleton()</text>
      <rect x="244" y="330" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="304" y="357" fill="#e2e8f0" text-anchor="middle">Swift 6</text>
      <rect x="376" y="330" width="96" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="424" y="357" fill="#e2e8f0" text-anchor="middle">SPM</text>
    </g>
  </g>

  <!-- Skeleton post card -->
  <g filter="url(#shadow)">
    <rect x="690" y="70" width="500" height="420" rx="32" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>
  <g fill="url(#shimmer)">
    <circle cx="752" cy="138" r="32"/>
    <rect x="802" y="112" width="220" height="18" rx="9"/>
    <rect x="802" y="144" width="140" height="14" rx="7"/>
    <rect x="720" y="196" width="440" height="16" rx="8"/>
    <rect x="720" y="224" width="400" height="16" rx="8"/>
    <rect x="720" y="252" width="230" height="16" rx="8"/>
    <rect x="720" y="290" width="440" height="130" rx="20"/>
    <rect x="720" y="442" width="84" height="22" rx="11"/>
    <rect x="820" y="442" width="64" height="22" rx="11"/>
  </g>
</svg>
